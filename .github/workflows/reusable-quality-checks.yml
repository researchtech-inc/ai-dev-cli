name: Reusable Quality Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.quality.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quality:
          - name: format
            command: format --check
          - name: check
            command: check
          - name: unit
            command: test --lane=unit
          - name: integration
            command: test --lane=integration

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv

      - name: Install artifact
        run: python -m pip install -e ".[dev]"

      - name: Run quality lane
        run: dev ${{ matrix.quality.command }}
