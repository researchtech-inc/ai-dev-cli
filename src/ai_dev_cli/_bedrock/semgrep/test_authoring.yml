rules:
  - id: no-custom-pytest-runner-hooks
    pattern-either:
      - pattern: |
          def pytest_pyfunc_call(...):
              ...
      - pattern: |
          def pytest_sessionfinish(...):
              ...
    message: "Custom pytest runner/session hooks are forbidden. Use pytest-asyncio and dev lane policy."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "tests/**/*.py"

  - id: no-path-dot-in-tests
    pattern: Path(".")
    message: "Path('.') is xdist-unsafe in tests. Use tmp_path or an explicit project path."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "tests/**/*.py"
        - "examples/tests/**/*.py"
        - "benchmarks/**/*.py"

  - id: no-stacked-parametrize
    pattern-either:
      - pattern: |
          @pytest.mark.parametrize(...)
          @pytest.mark.parametrize(...)
          def $F(...):
              ...
      - pattern: |
          @pytest.mark.parametrize(...)
          @pytest.mark.parametrize(...)
          async def $F(...):
              ...
    message: "Stacked parametrize creates multiplicative test matrices. Use one axis or the qualification lane."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "tests/**/*.py"
        - "examples/tests/**/*.py"
        - "benchmarks/**/*.py"

  - id: no-token-caps-in-tests
    pattern-either:
      - pattern: $F(..., max_completion_tokens=$N, ...)
      - pattern: $F(..., max_output_tokens=$N, ...)
      - pattern: $F(..., max_tokens=$N, ...)
    message: "Token caps in tests cause truncation flakes. Use framework defaults."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "tests/**/*.py"
        - "benchmarks/**/*.py"

  - id: no-live-llm-in-unit
    pattern-either:
      - pattern: AsyncOpenAI(...).chat.completions.create(...)
      - pattern: OpenAI(...).chat.completions.create(...)
      - pattern: AsyncOpenAI(...).completions.create(...)
      - pattern: OpenAI(...).completions.create(...)
      - pattern: AsyncOpenAI(...).responses.create(...)
      - pattern: OpenAI(...).responses.create(...)
    message: "Unit tests must not call live LLM APIs. Move the test or patch the provider boundary."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "tests/unit/**/*.py"

  - id: no-long-asyncio-sleep-outside-qualification
    patterns:
      - pattern: asyncio.sleep($SECONDS)
      - metavariable-comparison:
          metavariable: $SECONDS
          comparison: $SECONDS >= 1
    message: "asyncio.sleep() >= 1 second is allowed only in tests/qualification/."
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "tests/**/*.py"
        - "examples/tests/**/*.py"
        - "benchmarks/**/*.py"
      exclude:
        - "tests/qualification/**/*.py"
