rules:
  - id: no-example-in-docstring
    pattern-regex: '"""[\s\S]*?\bExample:\s*\n[\s\S]*?"""'
    message: "Docstrings must not contain Example: blocks"
    severity: WARNING
    languages: [python]
    paths:
      include: ["src/ai_dev_cli/"]

  - id: no-key-features-in-docstring
    pattern-regex: '"""[\s\S]*?\bKey features:\s*\n[\s\S]*?"""'
    message: "Docstrings must not contain 'Key features:' lists"
    severity: WARNING
    languages: [python]
    paths:
      include: ["src/ai_dev_cli/"]

  - id: no-note-in-docstring
    pattern-regex: '"""[\s\S]*?\bNote:\s*\n[\s\S]*?"""'
    message: "Docstrings must not contain 'Note:' sections - incorporate into main description"
    severity: WARNING
    languages: [python]
    paths:
      include: ["src/ai_dev_cli/"]
