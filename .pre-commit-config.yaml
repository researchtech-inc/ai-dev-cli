---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages:
          - pre-commit
      - id: end-of-file-fixer
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: dev-format
        name: dev format
        entry: dev format
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: dev-check
        name: dev check
        entry: dev check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
